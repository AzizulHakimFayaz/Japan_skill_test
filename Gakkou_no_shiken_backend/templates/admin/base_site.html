{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<script>
    (function () {
        try {
            var saved = localStorage.getItem('jazzmin-theme-mode');
            var mode = (saved === 'light' || saved === 'dark') ? saved : 'dark';
            document.documentElement.setAttribute('data-bs-theme', mode);
            document.documentElement.setAttribute('data-dropx-theme', mode);
            document.addEventListener('DOMContentLoaded', function () {
                var sb = document.getElementById('jazzy-sidebar');
                if (sb) sb.setAttribute('data-bs-theme', mode);
            });
        } catch (e) {}
    })();
</script>
{% endblock %}
